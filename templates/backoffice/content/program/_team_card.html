{% load i18n backoffice_tags %}
{% comment %}
  Одна карточка члена команды. Используется и в цикле, и в <template> для empty_form.
  Params:
    f            — BoundForm (saved instance ИЛИ formset.empty_form).
    translate_url, form_id — для _block_translate.html.
{% endcomment %}
<li class="bo-collapse-card{% if not f.instance.pk %} bo-collapse-card-new{% endif %}"
    x-data="boInlineCollapseCard({ initialOpen: {% if not f.instance.pk %}true{% else %}false{% endif %}, initialPhoto: '{% if f.instance.photo %}{{ f.instance.photo.url }}{% endif %}', placeholderLabel: '{% trans "Новый член команды" %}', summaryPrimary: 'name', summarySecondary: 'role' })">
  {% for hidden in f.hidden_fields %}{{ hidden }}{% endfor %}
  {{ f.order.as_hidden }}

  <header class="bo-collapse-card-head">
    <button type="button" class="bo-drag-handle" aria-label="{% trans 'Перетащить для сортировки' %}" title="{% trans 'Перетащить' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
    </button>

    <button type="button" class="bo-collapse-card-summary" @click="open = !open" :aria-expanded="open">
      <span class="bo-collapse-card-avatar" :class="!photoUrl && 'bo-collapse-card-avatar-empty'">
        <img :src="photoUrl" alt="" x-show="photoUrl" x-cloak>
        <svg x-show="!photoUrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </span>
      <span class="bo-collapse-card-info">
        <strong class="bo-collapse-card-name" x-text="displayName || placeholderLabel"></strong>
        <small class="bo-collapse-card-role" x-text="displaySecondary" x-show="displaySecondary" x-cloak></small>
      </span>
      <svg class="bo-collapse-card-chevron" :class="open && 'bo-collapse-card-chevron-open'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="bo-collapse-card-actions" @click.stop>
      {% include 'backoffice/content/_block_translate.html' with bases='["name","role","meta","quote"]' translate_url=translate_url form_id=form_id prefix=f.prefix|add:'-' %}
      {% if f.instance.pk %}
        <label class="bo-collapse-card-delete" :class="markedForDelete && 'bo-collapse-card-delete-on'">
          {{ f.DELETE }}
          <span x-text="markedForDelete ? '{% trans "Отменить" %}' : '{% trans "Удалить" %}'"></span>
        </label>
      {% else %}
        <button type="button" class="bo-collapse-card-remove" @click="$root.__remove($el.closest('li'))" aria-label="{% trans 'Убрать карточку' %}" title="{% trans 'Убрать карточку (до сохранения)' %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      {% endif %}
    </div>
  </header>

  <div class="bo-collapse-card-body" x-show="open" x-collapse>
    <div class="bo-team-photo-row">
      <div class="bo-team-photo-preview" :class="!photoUrl && 'bo-team-photo-preview-empty'">
        <img :src="photoUrl" alt="" x-show="photoUrl" x-cloak>
        <svg x-show="!photoUrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </div>
      <div class="bo-team-photo-controls">
        <label class="bo-media-replace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>{% trans "Изменить фото" %}</span>
          <input type="file" name="{{ f.photo.html_name }}" accept="image/*" @change="onPhotoChange($event)">
        </label>
        <p class="bo-help">{% trans "Квадрат, минимум 400×400. JPG/PNG до 5 MB." %}</p>
        {% for err in f.photo.errors %}<p class="bo-help" style="color:#b91c1c">{{ err }}</p>{% endfor %}
      </div>
    </div>

    {% include 'backoffice/content/_field_translatable.html' with form=f base='name' label='Имя' %}
    {% include 'backoffice/content/_field_translatable.html' with form=f base='role' label='Должность' %}
    {% include 'backoffice/content/_field_translatable.html' with form=f base='meta' label='Мета-строка' %}
    {% include 'backoffice/content/_field_translatable.html' with form=f base='quote' label='Цитата' %}
  </div>
</li>
