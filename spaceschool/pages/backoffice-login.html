          <p class="auth-sublabel">Backoffice</p>
        </header>

        <!-- Карточка -->
        <section class="auth-card">
          <header class="auth-card-head">
            <h1 class="auth-title">Вход в панель</h1>
            <p class="auth-subtitle">Введите данные учётной записи, чтобы продолжить.</p>
          </header>

          <form class="auth-form" method="post" action="#" novalidate>
            <!-- Глобальная ошибка (пример) -->
            <!-- <div class="auth-alert" role="alert">Неверный логин или пароль.</div> -->

            <div class="auth-field">
              <label for="id_username" class="auth-label">Логин</label>
              <input id="id_username" name="username" type="text" class="auth-input" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
            </div>

            <div class="auth-field">
              <div class="auth-label-row">
                <label for="id_password" class="auth-label">Пароль</label>
              </div>
              <input id="id_password" name="password" type="password" class="auth-input" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block auth-submit">
              <span>Войти</span>
              <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5" aria-hidden="true">
                <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
        </section>

        <footer class="auth-foot">
          <a href="/" class="auth-foot-link">← На сайт</a>
        </footer>
      </div>
    </main>
  </body>
</html>
